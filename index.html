<script>
const catalogo = JSON.parse(document.getElementById("catalogo").textContent);
const byId = id => document.getElementById(id);
const money = (value, currency) => new Intl.NumberFormat('pt-BR', {style:'currency', currency}).format(value);
const price = item => item.euro == null ? 'Consultar preço' : money(item.euro, 'EUR');
function element(tag, text) {
  const node = document.createElement(tag);
  if (text != null) node.textContent = text;
  return node;
}
let packs = [], cart = [], sequence = 0;
try {
  const saved = JSON.parse(localStorage.getItem('vitrine.carrinho') || '[]');
  const entries = new Map();
  for (const [profile, entry] of Object.entries(catalogo)) {
    for (const item of entry.items || []) entries.set(item.url, {...item, profile});
  }
  if (Array.isArray(saved)) cart = [...new Set(saved.map(p => p?.url))].map(url => entries.get(url)).filter(Boolean);
} catch {}
function saveCart() {
  try { localStorage.setItem('vitrine.carrinho', JSON.stringify(cart)); } catch {}
  renderCart();
  renderPacks();
}
function renderCart() {
  byId('checkout').disabled = sending || !cart.length;
  byId('cartButton').textContent = 'Carrinho (' + cart.length + ')';
  const lines = byId('lines');
  lines.replaceChildren();
  const totals = new Map();
  let unknown = 0;
  for (const item of cart) {
    const row = element('div');
    row.className = 'cart-row';
    const remove = element('button', 'Remover');
    remove.disabled = sending;
    remove.onclick = () => { cart = cart.filter(p => p.url !== item.url); saveCart(); };
    row.append(element('strong', item.name), element('p', '@' + catalogo[item.profile].alias + ' · ' + price(item)), remove);
    lines.append(row);
    if (item.euro == null) unknown++;
    else totals.set('EUR', (totals.get('EUR') || 0) + item.euro*100);
  }
  if (!cart.length) lines.append(element('p','Seu carrinho está vazio.'));
  const summary = [...totals].map(([currency, cents]) => money(cents/100, currency));
  if (unknown) summary.push(unknown + ' com preço a consultar');
  byId('total').textContent = summary.length ? 'Total da seleção: ' + summary.join(' + ') : '';
}
const todosPacks = Object.entries(catalogo).flatMap(([profile, entry]) =>
  (entry.items || []).map(item => ({...item, profile})));
function normalizarNome(texto) {
  return texto.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLocaleLowerCase('pt-BR');
}
function renderPacks() {
  const grid = byId('grid');
  grid.replaceChildren();
  const query = normalizarNome(byId('search').value.trim());
  const termos = query.split(/\s+/);
  const results = query ? todosPacks.filter(item => {
    const nome = normalizarNome(item.name);
    return termos.every(termo => nome.includes(termo));
  }) : packs;
  byId('busca-vitrine').parentElement.classList.toggle('pesquisando', Boolean(query));
  byId('packTitle').textContent = query ? 'Resultados (' + results.length + ')' : 'Packs disponíveis';
  for (const item of results) {
    const card = element('article');
    if (item.image) {
      const frame = element('div'), img = element('img');
      frame.className = 'cover-frame';
      img.alt = '';
      img.loading = 'lazy';
      // O quadro tem 90% da altura proporcional. A base da imagem fica alinhada à base do quadro.
      img.onload = () => { frame.style.aspectRatio = img.naturalWidth + ' / ' + (img.naturalHeight * 0.90); };
      img.src = item.image;
      frame.append(img);
      card.append(frame);
    }
    const body = element('div'), foot = element('div');
    body.className = 'body';
    foot.className = 'foot';
    if (query) body.append(element('small', '@' + catalogo[item.profile].alias));
    body.append(element('h3', item.name));
    if (item.description) {
      const details = element('details');
      details.append(element('summary','Descrição'), element('p',item.description));
      body.append(details);
    }
    const selected = cart.some(p => p.url === item.url);
    const add = element('button', selected ? 'No carrinho' : 'Adicionar ao carrinho');
    add.className = 'buy';
    add.disabled = selected;
    add.onclick = () => { cart.push(item); saveCart(); };
    foot.append(element('strong',price(item)), add);
    body.append(foot);
    card.append(body);
    grid.append(card);
  }
  if (query && !grid.children.length) grid.append(element('p','Nenhum pack encontrado.'));
}
function portrait(name) {
      const initial = element('span', name.charAt(0).toUpperCase());
      initial.className = 'portrait';
      initial.setAttribute('aria-hidden', 'true');
      if (catalogo[name].avatar) {
        const photo = element('img');
        photo.className = 'portrait';
        photo.alt = '';
        photo.onerror = () => photo.replaceWith(initial);
        photo.src = catalogo[name].avatar;
        return photo;
      }
      return initial;
}
// Enquadra apenas a faixa de 20% a 90% da altura original.
function fitBanner() {
  const img = byId('banner');
  if (!img.naturalWidth || img.hidden) return;
  const box = img.parentElement;
  const scale = Math.max(box.clientWidth / img.naturalWidth, box.clientHeight / (img.naturalHeight * 0.7));
  const width = img.naturalWidth * scale, height = img.naturalHeight * scale;
  Object.assign(img.style, {
    width: width + 'px', height: height + 'px',
    left: (box.clientWidth - width) / 2 + 'px',
    top: ((box.clientHeight - height * 0.7) / 2 - height * 0.2) + 'px'
  });
}
byId('banner').onload = fitBanner;
new ResizeObserver(fitBanner).observe(byId('banner').parentElement);
function loadProfile(name) {
  const source = catalogo[name];
  const photos = byId('photos');
  photos.replaceChildren();
  byId('gallery').hidden = !source.gallery?.length;
  for (const [index, url] of (source.gallery || []).slice(0, 20).entries()) {
    const frame = element('figure');
    const img = element('img');
    img.alt = 'Foto ' + (index + 1) + ' do feed';
    img.onload = () => {
      frame.style.aspectRatio = img.naturalWidth + ' / ' + (img.naturalHeight * 0.8);
    };
    img.onerror = () => {
      frame.remove();
      if (!photos.children.length) byId('gallery').hidden = true;
    };
    frame.append(img);
    photos.append(frame);
    img.src = url;
  }
  const banner = byId('banner');
  banner.hidden = !source.cover;
  banner.onerror = () => { banner.hidden = true; };
  if (source.cover) banner.src = source.cover;
  else banner.removeAttribute('src');
  packs = source.items.map(item => ({...item, profile:name}));
  byId('search').value = '';
  byId('handle').textContent = '@' + source.alias;
  byId('heroPhoto').replaceChildren(portrait(name));
  for (const btn of byId('profiles').children) btn.disabled = btn.dataset.name === name;
  byId('status').textContent = packs.length + ' packs · Atualizado em ' + new Date(source.updated).toLocaleString('pt-BR');
  renderPacks();
}
function start() {
    renderCart();
    const names = Object.keys(catalogo).filter(name => name !== '_exchange');
    for (const name of names) {
      const btn = element('button','@' + catalogo[name].alias);
      btn.className = 'creator';
      btn.prepend(portrait(name));
      btn.dataset.name = name;
      btn.onclick = () => loadProfile(name);
      byId('profiles').append(btn);
    }
    if (names.length) loadProfile(names[0]);
    else byId('status').textContent = 'Adicione um link ao perfis.txt e execute atualizar_catalogo.bat.';

}

let sending = false;
let pending = null;
try { pending = JSON.parse(localStorage.getItem('vitrine.pedido')); } catch {}
byId('checkout').onclick = async () => {
  if (sending || !cart.length) return;

  if (!BOT_TOKEN.trim() || !GRUPO_ID.trim()) {
    receipt.textContent = 'Preencha BOT_TOKEN e GRUPO_ID no index.html para habilitar o envio.';

  const urls = cart.map(item => item.url).sort();

  }
  sending = true;
  renderCart();

  try {
    const code = pending.id.slice(0, 8).toUpperCase();
    const lines = cart.map(item => '@' + catalogo[item.profile].alias + ' · ' + item.name + ' · ' + price(item));
    const total = cart.reduce((sum,item) => sum + (item.euro ?? 0), 0);
    const unknown = cart.some(item => item.euro == null);
    const message = ['Novo pedido ' + code, 'Aguardando atendimento', '', ...lines, '',
      'Total: ' + money(total,'EUR') + (unknown ? ' + itens a consultar' : '')].join('\n');
    if (message.length > 4096) throw Error('O pedido ficou muito longo. Divida os packs em dois pedidos.');
    const response = await fetch('https://api.telegram.org/bot' + BOT_TOKEN.trim() + '/sendMessage', {
      method:'POST', body:new URLSearchParams({chat_id:GRUPO_ID.trim(), text:message}),
      signal:AbortSignal.timeout(30000)
    });
    const data = await response.json();
    if (!response.ok || data.ok !== true) {
      throw Error('O Telegram recusou o envio. ' + (data.description || 'Confira o token, o grupo e a permissão do bot.'));
    }
    cart = cart.filter(item => !urls.includes(item.url));
    pending = null;
    try { localStorage.removeItem('vitrine.pedido'); } catch {}
    saveCart();
    receipt.textContent = 'Pedido ' + code + ' enviado! Converse com uma vendedora da Network das Gatinhas e informe esse código para combinar o pagamento e a entrega.';
  } catch (error) {
    receipt.textContent = 'Pedido ' + pending.id.slice(0,8).toUpperCase() + ' · ' +
      (error instanceof SyntaxError || error instanceof TypeError ? 'Não foi possível confirmar o envio. Confira no grupo pelo código antes de tentar novamente.' : error.message);
  } finally {
    sending = false;
    byId('checkout').textContent = 'Finalizar compra';
    renderCart();
  }
};
byId('cartButton').onclick = () => byId('cart').showModal();
byId('close').onclick = () => byId('cart').close();
byId('search').oninput = renderPacks;
start();
</script></html>
